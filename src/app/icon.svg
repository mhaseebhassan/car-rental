<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Monogram & Speedometer Hairline Dial -->
  <rect width="32" height="32" fill="#0E0E0E" />
  <!-- Gauge Arc -->
  <path d="M6 22 A10 10 0 1 1 26 22" stroke="#F3F1EC" stroke-width="1.5" stroke-linecap="square" stroke-dasharray="2 1.5" />
  <!-- Precision Needle pointing to performance redline -->
  <line x1="16" y1="18" x2="23" y2="10" stroke="#E8590C" stroke-width="1.5" stroke-linecap="square" />
  <!-- Center Pivot -->
  <circle cx="16" cy="18" r="2" fill="#E8590C" />
  <!-- Bottom Baseline Metric -->
  <line x1="8" y1="26" x2="24" y2="26" stroke="#F3F1EC" stroke-width="1.5" />
</svg>
